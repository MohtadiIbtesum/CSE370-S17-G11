<!DOCTYPE html>
<html>
<head>
  <title>PC Store</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
    }

    button {
      margin-top: 10px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Products</h1>
<a href="cart.html">Go to Cart</a>

<div id="products" class="grid"></div>

<script src="app.js"></script>

</body>
</html>
