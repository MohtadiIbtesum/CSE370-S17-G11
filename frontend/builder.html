<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PC Builder</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background: #111827;
    }

    .nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 30px;
    }

    /* LEFT SIDE */
    .panel {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    select {
      background: #111827;
      color: white;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    .btn-green { background: #22c55e; }
    .btn-blue { background: #38bdf8; }
    .btn-red { background: #ef4444; }

    /* PRODUCT LIST */
    .product {
      background: #111827;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }

    /* RIGHT SIDE */
    .summary {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .item {
      margin-bottom: 10px;
      padding: 8px;
      background: #111827;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="nav">
  <div>🧠 PC Builder</div>
  <div>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
  </div>
</div>

<div class="container">

  <!-- LEFT -->
  <div>

    <div class="panel">
      <h3>Select Component Type</h3>

      <select id="category" onchange="loadProducts()">
        <option value="1">CPU</option>
        <option value="2">GPU</option>
        <option value="3">Motherboard</option>
        <option value="4">RAM</option>
        <option value="5">Storage</option>
        <option value="6">PSU</option>
        <option value="7">Case</option>
      </select>

      <div id="products"></div>
    </div>

    <button class="btn-blue" onclick="checkCompatibility()">
      Check Compatibility
    </button>

  </div>

  <!-- RIGHT -->
  <div class="summary">
    <h3>Your Build</h3>

    <div id="build">
      <p>No components selected</p>
    </div>

    <button class="btn-green" onclick="addBuildToCart()">
      Add Build to Cart
    </button>
  </div>

</div>

<script src="builder.js"></script>

</body>
</html>
